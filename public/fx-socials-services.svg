<rect x="340" y="824" width="520" height="48" rx="24" fill="url(#blue)"/><text x="600" y="856" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">Choose a service  •  Follow the steps  •  You're ready!</text>
