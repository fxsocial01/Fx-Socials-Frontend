<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">FX Socials — your digital services, made simple</title>
<desc id="desc">A friendly illustrated guide showing account shopping, social media growth, phone numbers and eSIMs in four simple steps.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#dbe8ff"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2367e8"/><stop offset="1" stop-color="#654de8"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#315a9c" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="900" rx="54" fill="url(#bg)"/>
<circle cx="1060" cy="120" r="130" fill="#c9dcff" opacity=".55"/><circle cx="110" cy="780" r="160" fill="#c9dcff" opacity=".45"/>
<g font-family="Inter,Arial,sans-serif" fill="#17366c">
 <text x="600" y="105" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="7" fill="#3769c5">FX SOCIALS</text>
 <text x="600" y="174" text-anchor="middle" font-size="58" font-weight="900">Everything you need.</text>
 <text x="600" y="228" text-anchor="middle" font-size="35" font-weight="700" fill="#5b70a0">One simple place. Four easy choices.</text>
</g>
<g filter="url(#shadow)">
 <rect x="72" y="300" width="500" height="220" rx="32" fill="#fff"/>
 <rect x="628" y="300" width="500" height="220" rx="32" fill="#fff"/>
 <rect x="72" y="570" width="500" height="220" rx="32" fill="#fff"/>
 <rect x="628" y="570" width="500" height="220" rx="32" fill="#fff"/>
</g>
<g font-family="Inter,Arial,sans-serif">
 <g transform="translate(115 345)">
  <circle cx="65" cy="65" r="54" fill="#e8efff"/><path d="M35 44h60l-6 63H41z" fill="none" stroke="#2765db" stroke-width="8" stroke-linejoin="round"/><path d="M48 45c0-22 34-22 34 0" fill="none" stroke="#2765db" stroke-width="8" stroke-linecap="round"/><path d="M50 76h30" stroke="#2765db" stroke-width="7" stroke-linecap="round"/>
  <text x="145" y="52" font-size="30" font-weight="900" fill="#17366c">1. Buy accounts</text><text x="145" y="91" font-size="21" fill="#61769d">Choose a profile you need</text><text x="145" y="122" font-size="21" fill="#61769d">from the marketplace.</text>
 </g>
 <g transform="translate(675 345)">
  <circle cx="65" cy="65" r="54" fill="#eeeaff"/><path d="M37 92V65l19-17 17 13 24-29" fill="none" stroke="#654de8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M81 32h16v16" fill="none" stroke="#654de8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="52" font-size="30" font-weight="900" fill="#17366c">2. Grow social media</text><text x="145" y="91" font-size="21" fill="#61769d">Get likes, views, followers</text><text x="145" y="122" font-size="21" fill="#61769d">and other growth services.</text>
 </g>
 <g transform="translate(115 615)">
  <circle cx="65" cy="65" r="54" fill="#e6f7f3"/><rect x="42" y="25" width="46" height="82" rx="10" fill="none" stroke="#159b83" stroke-width="8"/><path d="M55 39h20M59 92h12" stroke="#159b83" stroke-width="6" stroke-linecap="round"/>
  <text x="145" y="52" font-size="30" font-weight="900" fill="#17366c">3. Get a number</text><text x="145" y="91" font-size="21" fill="#61769d">Find verification numbers</text><text x="145" y="122" font-size="21" fill="#61769d">and digital email services.</text>
 </g>
 <g transform="translate(675 615)">
  <circle cx="65" cy="65" r="54" fill="#fff3df"/><path d="M37 85c0-30 14-49 28-49s28 19 28 49" fill="none" stroke="#e49a28" stroke-width="8" stroke-linecap="round"/><path d="M49 87h32M65 35V19" stroke="#e49a28" stroke-width="8" stroke-linecap="round"/>
  <text x="145" y="52" font-size="30" font-weight="900" fill="#17366c">4. Get an eSIM</text><text x="145" y="91" font-size="21" fill="#61769d">Pick a digital mobile plan</text><text x="145" y="122" font-size="21" fill="#61769d">and stay connected.</text>
 </g>
